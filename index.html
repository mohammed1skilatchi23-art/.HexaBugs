body.t2:before{filter:blur(7px) saturate(1.2) hue-rotate(70deg)}body.t3:before{filter:blur(7px) saturate(1.1) hue-rotate(150deg) brightness(.8)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:6px 10px}
.top{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.btn{width:62px;height:62px;border:0;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 4px 8px #0006;flex:none}
.sign{flex:1;margin:0 4px;text-align:center;background:linear-gradient(#9a5d2c,#5a3016);border:4px solid #3f2008;border-radius:28px 28px 40px 40px;padding:2px 10px 8px;box-shadow:0 5px 12px #0008,inset 0 0 0 2px #c68a4a;position:relative}
.logo{font-size:38px;font-weight:900;color:#ffc93a;text-shadow:0 3px 0 #b3600f,0 5px 6px #0006;-webkit-text-stroke:1px #c7710f;direction:ltr}
.score{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:800;background:#3b1d0b;border-radius:18px;padding:0 30px;border:2px solid #7a4a22}
.bar{position:relative;height:17px;background:#0007;border-radius:5px;margin:5px 6px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8de35a,#ffd566);transition:width .3s}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#board{position:relative}
.c{position:absolute;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(#e8c883,#a97d3a);transition:transform .15s}
.c i{position:absolute;inset:5%;clip-path:inherit;background-size:cover;background-position:center;pointer-events:none}
.c.on{background:linear-gradient(#e3fbff,#46c8ff);transform:scale(1.08);z-index:2;filter:drop-shadow(0 0 7px #7ff)}
.c.drop i{animation:drop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-80px) scale(.4);opacity:0}}
.c.boom i{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.9) rotate(40deg);opacity:0}}
.hint{width:100%;max-width:460px;margin-bottom:8px;text-align:center;background:linear-gradient(#9a5d2c,#5a3016);color:#fff3d6;border:4px solid #3f2008;border-radius:18px;padding:10px 14px;font-weight:800;font-size:18px;line-height:1.4;box-shadow:0 4px 12px #0008,inset 0 0 0 2px #c68a4a}
#ov{position:fixed;padding:0;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0;background:radial-gradient(circle at 50% 30%,#ffb3e655,#150a30ee);z-index:5}
#ov.show{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.big{font-size:56px;font-weight:900;color:#ffc93a;text-shadow:0 4px 0 #b3600f;direction:ltr}
.plank{background:linear-gradient(#9a5d2c,#5a3016);border:4px solid var(--gold);border-radius:20px;padding:16px 36px;font-size:30px;font-weight:800;box-shadow:0 6px 18px #000a}
.plank small{display:block;font-size:20px;margin-top:6px;color:var(--gold)}
.go{font-size:26px;font-weight:800;color:#fff;padding:12px 44px;border-radius:30px;border:4px solid var(--gold);background:linear-gradient(#9a5d2c,#5a3016);box-shadow:0 5px 14px #000a}
.row{display:flex;gap:4px}.row b{width:68px;height:60px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background-size:cover}
.bar u{position:absolute;inset:0;text-align:center;font:800 12px/17px system-ui;text-decoration:none;direction:ltr;text-shadow:0 1px 2px #000}
body.t2:before{filter:blur(7px) saturate(1.3) hue-rotate(250deg)}body.t3:before{filter:blur(7px) hue-rotate(160deg) brightness(.55)}
.c em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;pointer-events:none;z-index:1}
.c.ice:after{content:"";position:absolute;inset:5%;clip-path:inherit;background:linear-gradient(135deg,#e6f8ffcc,#7fd0ff88);box-shadow:inset 0 0 14px #fff;pointer-events:none}
.c.bud i{filter:grayscale(.6) brightness(.85);transform:scale(.72)}
.c.sp{animation:pl .8s infinite alternate}@keyframes pl{to{filter:drop-shadow(0 0 10px #ffe36b) brightness(1.25)}}
.cf{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
body.t2:after,body.t3:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(#ffeaa0 0 2px,transparent 3px) 0 0/90px 110px,radial-gradient(#fff 0 1.5px,transparent 3px) 40px 50px/130px 95px;opacity:.6;animation:ff 8s linear infinite;z-index:-1}

.fit{position:relative;background-size:100% 100%;max-height:100dvh}
.startbtn{position:absolute;left:25%;top:81%;width:55%;height:11%;background:transparent;border:0}
.rp{position:absolute;left:15%;top:20.5%;width:70%;height:25.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#8a5226,#4f2b12);border:4px solid #ffd566;border-radius:18px;box-shadow:0 6px 16px #000a}
.rp b{font-size:38px}.rp small{font-size:19px;color:#ffd566;margin-top:4px}
.fit .tip{position:absolute;left:8%;right:8%;top:3%}
.by{font-size:13px;font-weight:800;color:#ffe9a8;letter-spacing:3px;direction:ltr;text-shadow:0 1px 2px #000;margin-top:1px}
.byname{position:absolute;left:50%;transform:translateX(-50%);top:29.5%;padding:2px 22px;font:800 20px system-ui;color:#ffe08a;background:linear-gradient(#8a5226,#4f2b12);border:2px solid #ffd566;border-radius:14px;letter-spacing:2px;direction:ltr;box-shadow:0 3px 8px #0008}
.bar:before,.bar:after{content:"";position:absolute;top:0;bottom:0;width:2px;background:#fffa;z-index:1}.bar:before{left:25%}.bar:after{left:50%}
#bn{max-width:92vw;text-align:center;position:fixed;left:50%;top:30%;transform:translate(-50%,0) scale(0);z-index:8;pointer-events:none;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(#8a5226,#4f2b12);border:3px solid #ffd566;border-radius:18px;padding:10px 18px;box-shadow:0 6px 18px #000a}
#bn.pop{animation:bn 2s forwards}@keyframes bn{15%{transform:translate(-50%,0) scale(1.1)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.c.shuf{animation:shf .75s}@keyframes shf{45%{transform:scale(.55) rotate(200deg);opacity:.35}100%{transform:none;opacity:1}}

.fly,.spk,.ptl,.rng{position:fixed;pointer-events:none;z-index:60;will-change:transform,opacity}
.fly u{position:absolute;left:32%;top:55%;width:36%;height:150%;border-radius:50%;background:linear-gradient(#ffd96bdd,#ffd96b00);filter:blur(4px)}
.fly s{position:absolute;top:4%;width:52%;height:46%;border-radius:60% 60% 40% 40%/80% 80% 20% 20%;background:radial-gradient(#fff,#cdf6ffcc 55%,#fff0 78%);transform-origin:50% 100%}
.fly s:nth-of-type(1){left:-30%;animation:wl .1s infinite alternate}
.fly s:nth-of-type(2){right:-30%;animation:wr .1s infinite alternate}
.fly b{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 0 6px #ffd96b)}
@keyframes wl{from{transform:rotate(-20deg)}to{transform:rotate(-70deg)}}
@keyframes wr{from{transform:rotate(20deg)}to{transform:rotate(70deg)}}
.spk{background:radial-gradient(#fff,#ffd34d 50%,#ffd34d00 72%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.ptl{background:linear-gradient(135deg,#ffc9e0,#ff7fb5);border-radius:80% 0 80% 0}
.rng{border:4px solid #ffd96b;border-radius:50%;box-shadow:0 0 28px #ffd96b,inset 0 0 28px #ffd96b}
.c em.bd{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);font-size:0;pointer-events:none;animation:bdp .8s infinite alternate}
@keyframes bdp{to{transform:translate(-50%,-50%) scale(1.18)}}
#tint{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background 1s}
#pz{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:2px solid #ffd96b;background:#1d4a2ecc;z-index:20;padding:0}
#pz::before{content:"";position:absolute;left:15px;top:12px;width:5px;height:18px;background:#ffd96b;box-shadow:11px 0 #ffd96b;border-radius:2px}
.pnl{background:linear-gradient(#17402bf2,#0c2a1ef2);border:3px solid #ffd96b;border-radius:22px;padding:18px 16px;width:min(86vw,340px);text-align:center;color:#ffe9a8;box-shadow:0 0 40px #ffd96b66;max-height:86dvh;overflow:auto}
.pnl h2{margin:0 0 12px;font-size:24px}
.pbtn,.pb2,.mrow button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:14px;border:2px solid #fff3b0;background:linear-gradient(#ffd96b,#e0a32a);color:#4a2a00;font-weight:bold;font-size:18px;font-family:inherit}
.mrow{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.mrow button{width:auto;min-width:120px;margin:0}
.best{position:fixed;left:0;right:0;top:calc(6px + env(safe-area-inset-top,0px));text-align:center;color:#fff3b0;font-weight:bold;text-shadow:0 2px 5px #000;z-index:5}
.lg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:52dvh;overflow:auto;margin-bottom:8px}
.lg button{padding:10px 0;border-radius:12px;border:2px solid #fff3b0;background:linear-gradient(#ffd96b,#e0a32a);color:#4a2a00;font-weight:bold;font-size:16px}
.lg button:disabled{filter:grayscale(1) brightness(.6)}

function startI18n(){i18nObs.observe(document.body,{childList:true,subtree:true,characterData:true})}
function retranslateAll(){i18nBusy=true;try{walkTexts(document.body,procText)}finally{i18nBusy=false}i18nObs.takeRecords();hintFit()}
function hintFit(){const h=$("hint"),sp=h&&h.firstElementChild;if(!sp||sp.tagName!=="SPAN")return;sp.style.display="inline-block";sp.style.fontSize="";const av=h.clientWidth-32,w=sp.getBoundingClientRect().width;if(w>av&&av>0){const fs=parseFloat(getComputedStyle(sp).fontSize);sp.style.fontSize=Math.max(8,fs*av/w*.98)+"px"}}
function setLang(l){if(!LNG.includes(l))return;LANG=l;sv({lang:l});document.documentElement.lang=l;document.body.dataset.lang=l;document.body.classList.toggle("ltr",l!=="ar");retranslateAll();if(inGame){ui();colUi()}}
function bindLang(cb){document.querySelectorAll("[data-l]").forEach(b=>{b.classList.toggle("on",b.dataset.l===LANG);b.onclick=()=>{setLang(b.dataset.l);cb&&cb()}})}
document.documentElement.lang=LANG;document.body.dataset.lang=LANG;document.body.classList.toggle("ltr",LANG!=="ar");
if(LANG!=="ar")retranslateAll();startI18n();
/* ===== «همسات الغابة الساحرة»: نسمات رياح + خرير ماء + عصافير + نحل + لحن حالم متجدد ===== */
let musicOn=ld().music!==false;
const Forest=(()=>{
  let S=null,want=false,noiseBuf=null;
  const rr=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],mf=m=>440*Math.pow(2,(m-69)/12);
  // تتابعات هادئة بجو «ليديان» حالم (ري ماجور): [نغمات الوسادة، نغمات اللحن]
  const CH=[
    [[50,54,57,64],[74,76,78,81,83,85,86]],   // ري ماجور 9
    [[47,54,59,62],[74,76,78,81,83,86]],      // سي صغير 7
    [[43,50,55,59],[74,76,78,79,83,86]],      // صول ماجور 7
    [[45,52,57,64],[73,74,76,78,81,83,85]],   // لا معلّق
    [[52,55,59,62],[74,76,78,79,83,81]]       // مي صغير 7
  ];
  function hold(p,t){if(p.cancelAndHoldAtTime)p.cancelAndHoldAtTime(t);else{p.cancelScheduledValues(t);p.setValueAtTime(p.value,t)}}
  function mkPan(v){try{const p=ac.createStereoPanner();p.pan.value=v;return p}catch(e){return ac.createGain()}}
  let bwv=null,bwc=null;
  function bw(){if(bwv&&bwc===ac)return bwv;const n=14,re=new Float32Array(n+1),im=new Float32Array(n+1);for(let h=1;h<=n;h++)im[h]=1/Math.pow(h,1.45);bwv=ac.createPeriodicWave(re,im);bwc=ac;return bwv}
  // ضجيج وردي ناعم (بدل الأبيض الحاد) مع دمج نقطة التكرار بتلاشٍ متساوي القدرة لإزالة الطقطقة
  function noise(){
    if(!noiseBuf||noiseBuf.sampleRate!==ac.sampleRate){
      const sr=ac.sampleRate,n=Math.floor(sr*8),fd=Math.floor(sr*.6),d=new Float32Array(n+fd);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<n+fd;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=b0+b1+b2+b3+b4+b5+b6+w*.5362;b6=w*.115926}
      const buf=ac.createBuffer(1,n,sr),o=buf.getChannelData(0);
      for(let i=0;i<n;i++)o[i]=d[i];
      for(let i=0;i<fd;i++){const t=i/fd;o[i]=d[i]*Math.sin(t*Math.PI/2)+d[n+i]*Math.cos(t*Math.PI/2)}
      let e=0;for(let i=0;i<n;i++)e+=o[i]*o[i];const g=.577/Math.sqrt(e/n);for(let i=0;i<n;i++)o[i]*=g;
      noiseBuf=buf}
    const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(0,rr(0,6));return s;
  }
  function build(){
    const s={alive:true,srcs:[],timer:null,t0:ac.currentTime};
    s.mg=ac.createGain();s.mg.gain.value=0;s.ml=ac.createBiquadFilter();s.ml.type="lowpass";s.ml.frequency.value=9000;s.ml.Q.value=.5;s.mg.connect(s.ml);s.ml.connect(ac.destination);
    // ناقل اللحن والعصافير مع صدى حالم
    s.bus=ac.createGain();const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;s.bus.connect(lp);lp.connect(s.mg);
    const wet=ac.createGain();wet.gain.value=.32;lp.connect(wet);
    [[.29,.3],[.43,.26]].forEach(([d,f])=>{const dl=ac.createDelay(1),fb=ac.createGain(),fl=ac.createBiquadFilter();dl.delayTime.value=d;fb.gain.value=f;fl.type="lowpass";fl.frequency.value=2300;wet.connect(dl);dl.connect(fl);fl.connect(fb);fb.connect(dl);fl.connect(s.mg)});
    // نسمات الرياح (ضجيج وردي ناعم + مرشحات مزدوجة لإزالة الفحيح)
    const w=noise(),wh=ac.createBiquadFilter(),wb=ac.createBiquadFilter(),wl=ac.createBiquadFilter(),wl2=ac.createBiquadFilter(),wg=ac.createGain(),wp=mkPan(0);
    wh.type="highpass";wh.frequency.value=60;wb.type="bandpass";wb.frequency.value=480;wb.Q.value=.4;wl.type="lowpass";wl.frequency.value=1300;wl2.type="lowpass";wl2.frequency.value=1300;wg.gain.value=.0036;
    w.connect(wh);wh.connect(wb);wb.connect(wl);wl.connect(wl2);wl2.connect(wg);wg.connect(wp);wp.connect(s.mg);s.srcs.push(w);
    // خشخشة أوراق ناعمة
    const lf=noise(),lb=ac.createBiquadFilter(),lh=ac.createBiquadFilter(),lg=ac.createGain(),lpn=mkPan(0);
    lb.type="bandpass";lb.frequency.value=2400;lb.Q.value=.6;lh.type="lowpass";lh.frequency.value=3600;lg.gain.value=.0006;
    lf.connect(lb);lb.connect(lh);lh.connect(lg);lg.connect(lpn);lpn.connect(s.mg);s.srcs.push(lf);
    s.wind={g:wg,b:wb,p:wp,lg:lg,lp:lpn};
    // خرير الماء (تضمين بطيء وناعم بدل التضمين السريع الذي يشبه الطقطقة)
    const r=noise(),rh=ac.createBiquadFilter(),rb=ac.createBiquadFilter(),rl=ac.createBiquadFilter(),rg=ac.createGain(),rp=mkPan(-.35);
    rh.type="highpass";rh.frequency.value=500;rb.type="bandpass";rb.frequency.value=1200;rb.Q.value=.6;rl.type="lowpass";rl.frequency.value=2800;rg.gain.value=.0032;
    r.connect(rh);rh.connect(rb);rb.connect(rl);rl.connect(rg);rg.connect(rp);rp.connect(s.mg);s.srcs.push(r);
    [[.35,.0009],[.8,.0006]].forEach(([fq,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=fq;g.gain.value=d;o.connect(g);g.connect(rg.gain);o.start();s.srcs.push(o)});
    s.rp=rp;
    const t=ac.currentTime;
    s.mg.gain.setValueAtTime(0,t);s.mg.gain.setTargetAtTime(1.4,t+.4,1.3); // دخول بطيء وناعم
    s.chord=-1;s.chordEnd=0;s.mi=2;s.nextMel=t+3;s.nextBird=t+3.5;s.nextBee=t+11;s.nextGust=t+.2;s.nextBub=t+1;s.birdQ=[];
    return s;
  }
  // وسادة صوتية دافئة تتغير ببطء
  function pad(c,t,len){
    c[0].forEach((m,i)=>{
      const f=mf(m),o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain(),f1=ac.createBiquadFilter();
      o.type="sine";o2.type="triangle";o.frequency.value=f;o2.frequency.value=f*(1+rr(-.003,.003));g2.gain.value=.35;
      f1.type="lowpass";f1.frequency.value=1300;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.0085,t+len*.3);g.gain.linearRampToValueAtTime(.0085,t+len*.7);g.gain.linearRampToValueAtTime(.0001,t+len+2.5);
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(f1);f1.connect(S.bus);
      o.start(t);o2.start(t);o.stop(t+len+2.6);o2.stop(t+len+2.6);
    });
  }
  // نغمة هارب/جلسل ناعمة بذيل طويل
  function harp(f,t,v,pn){
    const p=mkPan(pn),g=ac.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0004,t+2.8);
    [[1,1],[2,.16],[3,.05]].forEach(([k,a])=>{const o=ac.createOscillator(),og=ac.createGain();o.type="sine";o.frequency.value=f*k;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+2.9)});
    g.connect(p);p.connect(S.bus);
  }
  // زقزقة عصفور (نفس الصوت الجميل السابق دون تغيير)
  function bird(t,far){
    const base=rr(2300,4300)*(far?.85:1),n=2+Math.floor(Math.random()*4),kind=Math.random()<.4?1:0,pn=rr(-.8,.8),p=mkPan(pn),bus=ac.createGain();
    bus.gain.value=rr(.55,1)*(far?.38:1);{const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=far?3200:6800;bus.connect(fl);fl.connect(p)}p.connect(S.bus);
    for(let i=0;i<n;i++){
      const s=t+i*(kind?.13:rr(.16,.24)),d=kind?.11:rr(.07,.12),f0=base*(1+(i%2?.12:0)),o=ac.createOscillator(),g=ac.createGain();
      o.type="sine";o.frequency.setValueAtTime(f0,s);
      o.frequency.exponentialRampToValueAtTime(f0*(kind?1.08:(Math.random()<.5?1.45:.72)),s+d);
      if(kind){const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=rr(14,22);lg.gain.value=f0*.032;lf.connect(lg);lg.connect(o.frequency);lf.start(s);lf.stop(s+d+.05)}
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(rr(.012,.02),s+.02);g.gain.exponentialRampToValueAtTime(.0004,s+d);
      o.connect(g);g.connect(bus);o.start(s);o.stop(s+d+.05);
    }
  }

  // مغرّد حالم: صفير ناعم منساب بنغمات متدرجة مع اهتزاز لطيف
  function song(t,far){
    const p=mkPan(rr(-.7,.7)),bus=ac.createGain(),sc=[2093,2349,2637,3136,3520];
    bus.gain.value=(far?.35:.8)*rr(.8,1);{const sl=ac.createBiquadFilter();sl.type="lowpass";sl.frequency.value=far?3200:6800;bus.connect(sl);sl.connect(p)}p.connect(S.bus);
    const n=3+Math.floor(Math.random()*4);let f=pick(sc),tt=t;
    for(let i=0;i<n;i++){
      const d=rr(.16,.34),f2=Math.max(1700,Math.min(4300,f*pick([1.12,1.26,.89,.8,1.5,1.19]))),o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain(),lf=ac.createOscillator(),lg=ac.createGain();
      o.type="sine";o2.type="sine";o.frequency.setValueAtTime(f,tt);o.frequency.exponentialRampToValueAtTime(f2,tt+d*.75);
      o2.frequency.setValueAtTime(f*2,tt);o2.frequency.exponentialRampToValueAtTime(f2*2,tt+d*.75);g2.gain.value=.1;
      lf.frequency.value=rr(5,7.5);lg.gain.value=f*.011;lf.connect(lg);lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(rr(.011,.016),tt+.035);g.gain.setValueAtTime(.011,tt+d*.6);g.gain.exponentialRampToValueAtTime(.0004,tt+d+.06);
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(bus);
      o.start(tt);o2.start(tt);lf.start(tt);const e=tt+d+.1;o.stop(e);o2.stop(e);lf.stop(e);
      tt+=d+rr(.07,.17);f=f2;
    }
    return tt-t;
  }
  // نحلة أو دبور لطيف يعبر لثوانٍ
  function bee(t,hor){
    const dur=rr(2.8,4.3),f=hor?rr(122,148):rr(205,250),o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter(),bp=ac.createBiquadFilter(),p=mkPan(0),pk=hor?.011:.0095;
    o.setPeriodicWave(bw());o2.setPeriodicWave(bw());
    o.frequency.setValueAtTime(f*1.05,t);o.frequency.linearRampToValueAtTime(f*.95,t+dur);        // انجراف يشبه دوبلر أثناء العبور
    o2.frequency.setValueAtTime(f*1.05+2.2,t);o2.frequency.linearRampToValueAtTime(f*.95+2.2,t+dur); // تنافر طفيف يمنح الطنين طبيعية
    const vb=ac.createOscillator(),vg=ac.createGain();vb.frequency.value=rr(4,6);vg.gain.value=1.8;vb.connect(vg);vg.connect(o.frequency);vg.connect(o2.frequency);
    lp.type="lowpass";lp.frequency.value=hor?800:1250;lp.Q.value=.4;bp.type="bandpass";bp.frequency.value=hor?420:680;bp.Q.value=.8;
    const am=ac.createOscillator(),ag=ac.createGain(),mod=ac.createGain();am.frequency.value=rr(11,16);ag.gain.value=.07;mod.gain.value=.93;am.connect(ag);ag.connect(mod.gain);
    const cv=new Float32Array(64);for(let i=0;i<64;i++){const x=i/63;cv[i]=Math.max(.0001,pk*Math.pow(Math.sin(Math.PI*x),1.6))}
    g.gain.setValueAtTime(.0001,t);g.gain.setValueCurveAtTime(cv,t,dur);
    if(p.pan){const a=Math.random()<.5?-.85:.85;p.pan.setValueAtTime(a,t);p.pan.linearRampToValueAtTime(-a,t+dur)}
    o.connect(mod);o2.connect(mod);mod.connect(lp);lp.connect(bp);bp.connect(g);g.connect(p);p.connect(S.bus);
    const e=t+dur+.1;o.start(t);o2.start(t);vb.start(t);am.start(t);o.stop(e);o2.stop(e);vb.stop(e);am.stop(e);
  }
  function bubble(t){
    const o=ac.createOscillator(),g=ac.createGain(),fq=rr(600,1400);
    o.type="sine";o.frequency.setValueAtTime(fq,t);o.frequency.exponentialRampToValueAtTime(fq*rr(1.2,1.5),t+.08);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(rr(.0018,.0032),t+.025);g.gain.exponentialRampToValueAtTime(.0002,t+.13);
    o.connect(g);g.connect(S.rp);o.start(t);o.stop(t+.15);
  }
  function tick(){
    const s=S;if(!s||!s.alive||!ac||ac.state!=="running")return;
    const now=ac.currentTime,lim=now+.5;
    // الوسادة: تتبدل كل 10–16 ثانية بلا نمط ثابت
    if(s.chordEnd<lim){let n;do{n=Math.floor(Math.random()*CH.length)}while(n===s.chord);s.chord=n;const len=rr(10,16),t=Math.max(s.chordEnd,now+.05);pad(CH[n],t,len);s.chordEnd=t+len}
    // اللحن: نغمات متباعدة وغير منتظمة، أحيانًا جملة قصيرة صاعدة أو هابطة
    while(s.nextMel<lim){
      const pool=CH[s.chord][1];let t=Math.max(s.nextMel,now+.05);
      if(Math.random()<.2){ // جملة قصيرة
        const n=3+Math.floor(Math.random()*3),dir=Math.random()<.5?1:-1,gap=rr(.22,.34);let i=Math.max(0,Math.min(pool.length-1,s.mi+(dir>0?-1:1)*Math.floor(Math.random()*2)));
        for(let k=0;k<n;k++){harp(mf(pool[i]),t+k*gap,rr(.022,.034),rr(-.4,.4));i=Math.max(0,Math.min(pool.length-1,i+dir*(Math.random()<.7?1:2)))}
        s.mi=i;s.nextMel=t+n*gap+rr(3,6);
      }else{
        const st=pick([-2,-1,-1,0,1,1,2]);s.mi=Math.max(0,Math.min(pool.length-1,s.mi+st));
        harp(mf(pool[s.mi]),t,rr(.022,.04),rr(-.4,.4));
        s.nextMel=t+(Math.random()<.25?rr(4.5,8):rr(1.4,3.8));
      }
    }
    // عصافير: تغريد لثوانٍ ثم صمت
    while(s.nextBird<lim){
      const t=Math.max(s.nextBird,now+.05),n=2+Math.floor(Math.random()*3);let tt=t;
      for(let k=0;k<n;k++){const far=Math.random()<.3;if(Math.random()<.45)tt+=song(tt,far);else bird(tt,far);tt+=rr(.9,1.8)}
      s.nextBird=tt+rr(7,14);
    }
    // نحلة أو دبور أحيانًا
    if(s.nextBee<lim){bee(Math.max(s.nextBee,now+.05),Math.random()<.3);s.nextBee=now+rr(16,28)}
    // هبّات الريح
    if(s.nextGust<lim){const t=Math.max(s.nextGust,now),w=s.wind;
      const k=Math.random(),pn=rr(-.55,.55),tc=rr(1.8,3.4);w.g.gain.setTargetAtTime(.0031+k*.0117,t,tc);w.lg.gain.setTargetAtTime(.0006+k*.0041,t,tc);w.b.frequency.setTargetAtTime(rr(320,900),t,2.5);if(w.p.pan){w.p.pan.setTargetAtTime(pn,t,3);w.lp.pan&&w.lp.pan.setTargetAtTime(-pn*.6,t,3)}s.nextGust=t+rr(4,8)}
    // فقاعات ماء خفيفة وغير منتظمة
    while(s.nextBub<lim){bubble(Math.max(s.nextBub,now+.02));s.nextBub+=rr(.25,1.1)}
  }
  function startSession(){
    if(S||!ac)return;
    try{S=build();const me=S;me.timer=setInterval(tick,150);tick()}catch(e){S=null}
  }
  // إخفات سلس ثم إيقاف كامل لكل المصادر والمؤقتات
  function kill(sec){
    const s=S;if(!s)return;S=null;s.alive=false;clearInterval(s.timer);
    try{const t=ac.currentTime;hold(s.mg.gain,t);s.mg.gain.setTargetAtTime(0,t,Math.max(.05,sec/4))}catch(e){}
    setTimeout(()=>{s.srcs.forEach(x=>{try{x.stop()}catch(e){}});try{s.mg.disconnect()}catch(e){}try{s.ml.disconnect()}catch(e){}try{s.bus.disconnect()}catch(e){}},sec*1000+500);
  }
  const ok=()=>want&&musicOn&&!mute&&ac;
  return{
    begin(){want=true;kill(.3);if(ok())startSession()},   // جولة جديدة: بداية نظيفة من الصفر
    end(){want=false;kill(1.4)},                           // نهاية الجولة: إخفات ثم صمت
    sync(){ok()?startSession():kill(.5)}                  // تبديل الصوت/الموسيقى من الإعدادات
  };
})();
// فتح الصوت عند أول لمسة (شرط المتصفحات والتطبيقات)
function mkAC(){const C=window.AudioContext||window.webkitAudioContext;try{return new C({latencyHint:"balanced"})}catch(e){return new C()}}
function unlockAudio(){
  try{ac=ac||mkAC();if(ac.state==="suspended")ac.resume();Forest.sync()}catch(e){}
}
addEventListener("pointerdown",unlockAudio,{capture:true});
addEventListener("keydown",unlockAudio,{capture:true});
document.addEventListener("visibilitychange",()=>{if(!ac)return;if(document.hidden){try{ac.suspend()}catch(e){}}else{try{ac.resume().then(()=>Forest.sync())}catch(e){}}});
// ربط الموسيقى بدورة الجولة: تبدأ مع كل جولة، وتخفت عند أي شاشة نهاية أو عند الخروج للقائمة
{
  const _i=intro;intro=function(){try{Forest.begin()}catch(e){}return _i.apply(this,arguments)};
  const _v=victory;victory=function(){const w=ended,r=_v.apply(this,arguments);if(!w&&ended)try{Forest.end()}catch(e){}return r};
  const _l=lose;lose=function(){const w=ended,r=_l.apply(this,arguments);if(!w&&ended)try{Forest.end()}catch(e){}return r};
  const _d=done;done=function(){try{Forest.end()}catch(e){}return _d.apply(this,arguments)};
  const _dt=doneTimed;doneTimed=function(){try{Forest.end()}catch(e){}return _dt.apply(this,arguments)};
  const _s=start;start=function(){try{Forest.end()}catch(e){}return _s.apply(this,arguments)};
  $("back").onclick=start;
}

layout();start();
</script></body></html>
